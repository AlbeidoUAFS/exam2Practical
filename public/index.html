<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap Home Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <h1>Home Page</h1>
     <div class="container">
        <div class="col">
            <button id="refresh" class="btn btn-primary">Refresh Courses</button>
            <div id="message"></div>
            <table id="coursetable" class="table table-bordered table-striped">

            </table>
        </div>
    </div>
<h2>Add New Courses</h2>
<div class="container mt-5">
    <h2>Add New Course</h2>
    <!-- Added all missing input fields matching your JS document.getElementById calls -->
    <form id="courseForm" class="row g-3">
        <div class="col-md-6">
            <label for="courseNo" class="form-label">courseNo</label>
            <input type="text" class="form-control" id="courseNo" required>
        </div>
        <div class="col-md-6">
            <label for="courseDesc" class="form-label">courseDesc</label>
            <input type="text" class="form-control" id="courseDesc" required>
        </div>
        <div class="col-md-6">
            <label for="lastSemTaught" class="form-label">lastSemTaught</label>
            <input type="text" class="form-control" id="lastSemTaught" required>
        </div>
        <div class="col-md-6">
            <label for="maxStudents" class="form-label">maxStudents</label>
            <input type="text" class="form-control" id="maxStudents" required>
        </div>     
        <div class="col-12 mt-3">
            <button type="submit" class="btn btn-success">Submit Course</button>
        </div>
    </form>
</div>

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"
        integrity="sha384-q2kxQ16AaE6UbzuKqyBE9/u/KzioAlnx2maXQHiDX9d4/zp8Ok3f+M7DPm+Ib6IU"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta1/dist/js/bootstrap.min.js"
        integrity="sha384-pQQkAEnwaBkjpqZ8RU1fF1AKtTcHJwFl3pblpTlHXybJjHpMYo79HY3hIi4NKxyj"
        crossorigin="anonymous"></script>
         <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    
        <script src="courses.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
